<!--
  ═══════════════════════════════════════════════════════════════════════
  PATCH 1 OF 2  —  CUSTOMER TICKETS SECTION
  ═══════════════════════════════════════════════════════════════════════

  HOW TO APPLY:
  1. In index.html, find the sidebar <nav> block and add this nav item
     after "My Orders" and before "Account":

       <div class="nav-item" onclick="navTo('tickets')">
         <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
           <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14
                    a2 2 0 0 1 2 2z"/>
         </svg>
         My Tickets
         <span class="nav-badge" id="ticketsBadge" style="display:none">●</span>
       </div>

  2. In the pageTitles object (around line 1739), add:
         tickets: 'MY TICKETS',

  3. In navTo(), in the if-chain (around line 1755), add:
         if (page === 'tickets') loadTickets();

  4. Paste the <div id="sec-tickets"> block below right after
     the closing </div> of #sec-orders (around line 1037).

  5. Paste the <script> block at the bottom, before </body>.
  ═══════════════════════════════════════════════════════════════════════
-->

<!-- ══════════════════ CUSTOMER TICKETS SECTION ══════════════════ -->
<div class="page-section" id="sec-tickets">

  <!-- Header row -->
  <div class="sec-hd" style="flex-wrap:wrap;gap:12px;">
    <div>
      <div class="sec-title">MY TICKETS</div>
      <div class="sec-sub">Track and manage your support requests</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <button class="btn-primary" style="padding:9px 18px;font-size:13px;margin-top:0;"
              onclick="openNewTicketModal()">+ New Ticket</button>
      <button class="btn-secondary" onclick="loadTickets()">↻ Refresh</button>
    </div>
  </div>

  <!-- Filter tabs -->
  <div class="filter-row" id="ticketsFilterRow">
    <button class="cat-btn active" onclick="filterTickets('all',this)">All</button>
    <button class="cat-btn" onclick="filterTickets('open',this)">🔴 Open</button>
    <button class="cat-btn" onclick="filterTickets('pending',this)">🟡 Pending</button>
    <button class="cat-btn" onclick="filterTickets('resolved',this)">🟢 Resolved</button>
    <button class="cat-btn" onclick="filterTickets('closed',this)">⬛ Closed</button>
  </div>

  <!-- Tickets list -->
  <div id="ticketsList">
    <div class="loading-spinner"><div class="spinner"></div><span>Loading tickets…</span></div>
  </div>

</div>

<!-- ══════════════════ NEW TICKET MODAL ══════════════════ -->
<div class="modal-overlay" id="newTicketModal" style="display:none;"
     onclick="if(event.target===this)closeNewTicketModal()">
  <div class="modal" style="max-width:440px;">
    <button class="modal-close" onclick="closeNewTicketModal()">✕</button>
    <div class="modal-title">OPEN NEW TICKET</div>
    <div class="modal-sub" style="margin-bottom:20px;">
      Describe your issue and our team will respond shortly.
    </div>

    <div class="modal-field">
      <label>Issue Type</label>
      <select id="ntType" style="width:100%;background:rgba(255,255,255,.05);
              border:1px solid var(--border);border-radius:10px;padding:12px 14px;
              color:var(--white);font-family:'Montserrat',sans-serif;font-size:14px;
              outline:none;">
        <option value="wrong_order">📦 Wrong Order (wrong link / qty / service)</option>
        <option value="delay">⏳ Delayed Service (no delivery after 24h)</option>
      </select>
    </div>

    <div class="modal-field">
      <label>Describe your issue</label>
      <textarea id="ntMessage" rows="4" placeholder="e.g. I ordered 1000 followers but the link was wrong…"
        style="width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);
               border-radius:10px;padding:12px 14px;color:var(--white);
               font-family:'Montserrat',sans-serif;font-size:14px;outline:none;
               resize:vertical;line-height:1.5;"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeNewTicketModal()">Cancel</button>
      <button class="btn-primary" id="ntSubmitBtn" onclick="submitNewTicket()"
              style="margin-top:0;">Submit Ticket</button>
    </div>
  </div>
</div>

<!-- ══════════════════ TICKET THREAD MODAL ══════════════════ -->
<div class="modal-overlay" id="ticketThreadModal" style="display:none;"
     onclick="if(event.target===this)closeTicketThread()">
  <div class="modal" style="max-width:560px;height:80vh;display:flex;
                             flex-direction:column;padding:0;overflow:hidden;">
    <!-- Header -->
    <div style="padding:18px 20px 14px;border-bottom:1px solid var(--border);
                display:flex;align-items:center;gap:12px;flex-shrink:0;
                background:linear-gradient(135deg,rgba(61,212,74,.06),rgba(61,212,74,.02));">
      <div style="flex:1;min-width:0;">
        <div id="ttTitle" style="font-size:15px;font-weight:800;color:var(--white);"></div>
        <div id="ttMeta"  style="font-size:11px;color:var(--muted);margin-top:3px;"></div>
      </div>
      <div id="ttStatusBadge"></div>
      <button onclick="closeTicketThread()" style="background:none;border:none;
              color:var(--muted);cursor:pointer;font-size:18px;line-height:1;
              padding:4px;border-radius:6px;" onmouseover="this.style.color='var(--white)'"
              onmouseout="this.style.color='var(--muted)'">✕</button>
    </div>

    <!-- Messages -->
    <div id="ttMessages" style="flex:1;overflow-y:auto;padding:16px 18px;
                                 display:flex;flex-direction:column;gap:10px;
                                 scroll-behavior:smooth;">
    </div>

    <!-- Closed banner -->
    <div id="ttClosedBanner" style="display:none;padding:10px 18px;
         background:rgba(122,143,173,.07);border-top:1px solid rgba(122,143,173,.2);
         font-size:12px;font-weight:700;color:var(--muted);text-align:center;
         flex-shrink:0;">
      🔒 This ticket is closed — open a new ticket if you need more help
    </div>

    <!-- Reply input -->
    <div id="ttReplyRow" style="padding:12px 14px;border-top:1px solid var(--border);
          display:flex;gap:8px;align-items:center;flex-shrink:0;">
      <textarea id="ttReplyInput" rows="1"
        placeholder="Type your reply…"
        style="flex:1;background:#1a2435;border:1px solid rgba(61,212,74,.18);
               border-radius:10px;padding:10px 14px;color:var(--white);
               font-family:'Montserrat',sans-serif;font-size:13px;outline:none;
               resize:none;height:42px;max-height:100px;line-height:1.4;overflow-y:hidden;
               transition:border-color .2s;"
        oninput="this.style.height='42px';this.style.height=Math.min(this.scrollHeight,100)+'px';"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendTicketReply();}"
        onfocus="this.style.borderColor='rgba(61,212,74,.45)'"
        onblur="this.style.borderColor='rgba(61,212,74,.18)'"></textarea>
      <button onclick="sendTicketReply()"
              style="width:40px;height:40px;border-radius:10px;flex-shrink:0;
                     background:linear-gradient(135deg,#3dd44a,#28a035);border:none;
                     cursor:pointer;display:flex;align-items:center;justify-content:center;
                     transition:all .2s;"
              onmouseover="this.style.transform='scale(1.05)'"
              onmouseout="this.style.transform='scale(1)'">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="white">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- ══════════════════ TICKETS CSS ══════════════════ -->
<style>
/* Ticket card */
.ticket-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all .18s;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.ticket-card:hover {
  border-color: rgba(61,212,74,.35);
  background: rgba(61,212,74,.03);
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(0,0,0,.3);
}
.ticket-icon {
  width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  background: rgba(61,212,74,.08);
  border: 1px solid rgba(61,212,74,.15);
}
.ticket-body { flex: 1; min-width: 0; }
.ticket-title {
  font-size: 14px; font-weight: 700; color: var(--white);
  margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ticket-preview {
  font-size: 12px; color: var(--muted); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px;
}
.ticket-footer {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.ticket-meta { font-size: 11px; color: var(--muted); }
.ticket-status {
  font-size: 11px; font-weight: 700; padding: 2px 8px;
  border-radius: 6px; white-space: nowrap;
}
.ts-open     { background: rgba(229,57,53,.12); color: #ef5350; }
.ts-pending  { background: rgba(255,112,67,.12); color: #ff7043; }
.ts-resolved { background: rgba(61,212,74,.12);  color: #3dd44a; }
.ts-closed   { background: rgba(122,143,173,.12);color: #7a8fad; }
.ticket-unread {
  width: 8px; height: 8px; border-radius: 50%;
  background: #3dd44a; flex-shrink: 0; margin-top: 4px;
  animation: pulse 2s infinite;
}
/* Thread messages inside modal */
.tt-msg { display: flex; gap: 8px; align-items: flex-end; max-width: 88%; }
.tt-msg.from-admin { align-self: flex-start; }
.tt-msg.from-user  { align-self: flex-end; flex-direction: row-reverse; }
.tt-avatar {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 13px;
}
.tt-bubble {
  padding: 10px 13px; border-radius: 14px; font-size: 13px;
  line-height: 1.55; max-width: 340px; word-break: break-word;
}
.tt-msg.from-admin.is-bot  .tt-bubble {
  background: #1a2435; border: 1px solid rgba(61,212,74,.15);
  color: #d0dff0; border-radius: 4px 14px 14px 14px;
}
.tt-msg.from-admin.is-human .tt-bubble {
  background: #152b1e; border: 1px solid rgba(61,212,74,.45);
  color: #e0f8e8; border-radius: 4px 14px 14px 14px;
}
.tt-msg.from-user .tt-bubble {
  background: linear-gradient(135deg,#3dd44a,#28a035);
  color: #fff; border-radius: 14px 4px 14px 14px;
}
.tt-time { font-size: 10px; color: #3a5570; margin-top: 4px; }
.tt-msg.from-admin.is-human .tt-time { color: #3dd44a; font-weight: 700; }
.tt-msg.from-user .tt-time { text-align: right; }
/* Empty tickets state */
.tickets-empty {
  text-align: center; padding: 60px 20px; color: var(--muted);
}
.tickets-empty .icon { font-size: 48px; margin-bottom: 14px; }
.tickets-empty p { font-size: 14px; line-height: 1.6; }
</style>

<!-- ══════════════════ TICKETS JAVASCRIPT ══════════════════ -->
<script>
/* ─── State ─────────────────────────────────────────────── */
let _allTickets     = [];
let _ticketFilter   = 'all';
let _activeTicketId = null;
let _ticketPollTimer = null;

/* ─── Load & render list ────────────────────────────────── */
async function loadTickets() {
  const el = document.getElementById('ticketsList');
  el.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><span>Loading tickets…</span></div>';
  try {
    const data = await api('/support/threads');
    _allTickets = (data || []).sort((a, b) =>
      new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at)
    );
    _renderTicketList();
    _updateTicketsBadge();
  } catch(e) {
    el.innerHTML = `<div class="tickets-empty"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
  }
}

function filterTickets(f, btn) {
  _ticketFilter = f;
  document.querySelectorAll('#ticketsFilterRow .cat-btn')
    .forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  _renderTicketList();
}

function _renderTicketList() {
  const el = document.getElementById('ticketsList');
  let list = _allTickets;
  if (_ticketFilter !== 'all') list = list.filter(t => t.status === _ticketFilter);

  if (!list.length) {
    el.innerHTML = `<div class="tickets-empty">
      <div class="icon">🎫</div>
      <p>${_ticketFilter === 'all'
        ? 'No tickets yet.<br>Click <strong>+ New Ticket</strong> to get help from our team.'
        : `No ${_ticketFilter} tickets.`}</p>
    </div>`;
    return;
  }

  el.innerHTML = list.map(t => {
    const typeIcon  = t.type === 'wrong_order' ? '📦' : '⏳';
    const typeLabel = t.type === 'wrong_order' ? 'Wrong Order' : 'Delayed Service';
    const last      = t.last_message;
    const preview   = last ? _ticketPreview(last.body) : 'No messages yet';
    const date      = t.updated_at || t.created_at
      ? new Date(t.updated_at || t.created_at).toLocaleDateString('en-KE',
          { day:'numeric', month:'short', year:'numeric' })
      : '—';
    const hasUnread = t.status === 'pending';   // admin replied, user hasn't opened
    const stCls     = `ts-${t.status}`;
    const stLabel   = { open:'🔴 Open', pending:'🟡 Replied', resolved:'🟢 Resolved', closed:'⬛ Closed' }[t.status] || t.status;
    const msgCount  = t.message_count || 0;

    return `<div class="ticket-card" onclick="openTicketThread('${t.id}')">
      <div class="ticket-icon">${typeIcon}</div>
      <div class="ticket-body">
        <div class="ticket-title">${typeLabel} #${t.id.slice(0,8)}</div>
        <div class="ticket-preview">${preview}</div>
        <div class="ticket-footer">
          <span class="ticket-status ${stCls}">${stLabel}</span>
          <span class="ticket-meta">${msgCount} message${msgCount!==1?'s':''}</span>
          <span class="ticket-meta">· ${date}</span>
        </div>
      </div>
      ${hasUnread ? '<div class="ticket-unread" title="New reply from support"></div>' : ''}
    </div>`;
  }).join('');
}

function _ticketPreview(body) {
  return (body || '').replace(/\*\*(.*?)\*\*/g, '$1').replace(/\n/g, ' ').slice(0, 90) + ((body||'').length > 90 ? '…' : '');
}

function _updateTicketsBadge() {
  const badge   = document.getElementById('ticketsBadge');
  const pending = _allTickets.filter(t => t.status === 'pending').length;
  if (badge) {
    badge.style.display = pending ? 'inline-flex' : 'none';
    badge.textContent   = pending || '';
  }
}

/* ─── Open thread modal ─────────────────────────────────── */
async function openTicketThread(threadId) {
  _activeTicketId = threadId;
  const modal = document.getElementById('ticketThreadModal');
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';

  document.getElementById('ttMessages').innerHTML =
    '<div class="loading-spinner"><div class="spinner"></div><span>Loading…</span></div>';

  await _loadTicketThread(threadId);
  _startTicketPoll();
}

async function _loadTicketThread(threadId) {
  try {
    const t = await api(`/support/threads/${threadId}`);
    const typeLabel = t.type === 'wrong_order' ? '📦 Wrong Order' : '⏳ Delayed Service';
    document.getElementById('ttTitle').textContent = `${typeLabel} #${t.id.slice(0,8)}`;
    document.getElementById('ttMeta').textContent  =
      `Opened ${new Date(t.created_at).toLocaleDateString('en-KE',
        {day:'numeric',month:'short',year:'numeric'})} · ${(t.messages||[]).length} messages`;

    const stLabel = { open:'🔴 Open', pending:'🟡 Replied', resolved:'🟢 Resolved', closed:'⬛ Closed' }[t.status] || t.status;
    const stCls   = `ts-${t.status}`;
    document.getElementById('ttStatusBadge').innerHTML =
      `<span class="ticket-status ${stCls}" style="font-size:12px;">${stLabel}</span>`;

    // Messages
    const user    = _getTicketUser();
    const initial = (user.name || 'U').charAt(0).toUpperCase();
    const msgs    = t.messages || [];
    const el      = document.getElementById('ttMessages');
    el.innerHTML  = '';

    if (!msgs.length) {
      el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px;">No messages yet.</div>';
    } else {
      msgs.forEach(m => el.insertAdjacentHTML('beforeend', _ttMsgHtml(m, initial)));
    }

    setTimeout(() => { el.scrollTop = el.scrollHeight; }, 60);

    // Closed / resolved — lock input
    const isClosed = ['resolved','closed'].includes(t.status);
    document.getElementById('ttClosedBanner').style.display = isClosed ? 'block' : 'none';
    document.getElementById('ttReplyRow').style.display     = isClosed ? 'none'  : 'flex';

  } catch(e) {
    document.getElementById('ttMessages').innerHTML =
      `<div style="padding:24px;color:var(--muted);">⚠️ ${e.message}</div>`;
  }
}

function _ttMsgHtml(m, userInitial) {
  const isAdmin  = m.sender === 'admin';
  const isBot    = m.is_bot;
  const avatar   = isAdmin
    ? (isBot
        ? `<div class="tt-avatar" style="background:linear-gradient(135deg,#3dd44a,#1a6b23);font-size:14px;">🦠</div>`
        : `<div class="tt-avatar" style="background:linear-gradient(135deg,#28a035,#1a6b23);font-size:14px;box-shadow:0 0 0 2px rgba(61,212,74,.4);">👤</div>`)
    : `<div class="tt-avatar" style="background:linear-gradient(135deg,#243048,#1a2435);color:#3dd44a;font-weight:800;font-size:13px;">${userInitial}</div>`;

  const humanCls = isAdmin ? (isBot ? 'is-bot' : 'is-human') : '';
  const senderName = isAdmin ? (isBot ? 'EndaViral Bot' : 'EndaViral Support') : 'You';
  const time = m.created_at
    ? new Date(m.created_at).toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'})
    : '';
  const body = (m.body||'')
    .replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>');

  return `<div class="tt-msg from-${isAdmin?'admin':'user'} ${humanCls}">
    ${avatar}
    <div>
      <div class="tt-bubble">${body}</div>
      <div class="tt-time">${senderName} · ${time}</div>
    </div>
  </div>`;
}

/* ─── Send reply from thread modal ─────────────────────── */
async function sendTicketReply() {
  const input = document.getElementById('ttReplyInput');
  const body  = input.value.trim();
  if (!body || !_activeTicketId) return;

  input.value = '';
  input.style.height = '42px';

  // Optimistic render
  const user    = _getTicketUser();
  const initial = (user.name || 'U').charAt(0).toUpperCase();
  const fakeMsg = { sender:'user', is_bot:false, body, created_at: new Date().toISOString() };
  document.getElementById('ttMessages').insertAdjacentHTML('beforeend', _ttMsgHtml(fakeMsg, initial));
  const el = document.getElementById('ttMessages');
  el.scrollTop = el.scrollHeight;

  try {
    await api(`/support/threads/${_activeTicketId}/messages`, {
      method: 'POST',
      body: JSON.stringify({ body })
    });
    // Reload to get server-side message list (including bot reply if any)
    await _loadTicketThread(_activeTicketId);
    await loadTickets(); // refresh list badges
  } catch(e) {
    toast(e.message || 'Failed to send message', 'error');
  }
}

/* ─── New ticket modal ──────────────────────────────────── */
function openNewTicketModal() {
  document.getElementById('newTicketModal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
  document.getElementById('ntMessage').value = '';
}

function closeNewTicketModal() {
  document.getElementById('newTicketModal').style.display = 'none';
  document.body.style.overflow = '';
}

async function submitNewTicket() {
  const type    = document.getElementById('ntType').value;
  const message = document.getElementById('ntMessage').value.trim();
  if (!message) { toast('Please describe your issue first.', 'error'); return; }

  const btn = document.getElementById('ntSubmitBtn');
  btn.textContent = 'Submitting…'; btn.disabled = true;
  try {
    const data = await api('/support/threads', {
      method: 'POST',
      body: JSON.stringify({ type, first_message: message })
    });
    closeNewTicketModal();
    toast('Ticket opened! Our team will respond shortly.', 'success');
    await loadTickets();
    openTicketThread(data.id);
  } catch(e) {
    toast(e.message || 'Failed to open ticket', 'error');
  } finally {
    btn.textContent = 'Submit Ticket'; btn.disabled = false;
  }
}

/* ─── Thread modal close ────────────────────────────────── */
function closeTicketThread() {
  _stopTicketPoll();
  _activeTicketId = null;
  document.getElementById('ticketThreadModal').style.display = 'none';
  document.body.style.overflow = '';
  loadTickets(); // refresh badges
}

/* ─── Polling (while thread modal is open) ──────────────── */
function _startTicketPoll() {
  _stopTicketPoll();
  _ticketPollTimer = setInterval(async () => {
    if (_activeTicketId) await _loadTicketThread(_activeTicketId);
  }, 6000);
}

function _stopTicketPoll() {
  if (_ticketPollTimer) { clearInterval(_ticketPollTimer); _ticketPollTimer = null; }
}

function _getTicketUser() {
  try { return JSON.parse(localStorage.getItem('ev_user') || '{}'); } catch(_) { return {}; }
}
</script>
