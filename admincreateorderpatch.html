<!--
  ═══════════════════════════════════════════════════════════════════════
  PATCH 2 OF 2  —  ADMIN: CREATE ORDER FOR CUSTOMER
  ═══════════════════════════════════════════════════════════════════════

  HOW TO APPLY:
  1. In the admin-tabs bar (around line 1133 of index.html), add:
       <div class="admin-tab" onclick="adminTab('create-order',this)">
         ➕ Create Order
       </div>

  2. In adminTab() function (around line 2248), add:
       if (tab === 'create-order') initAdminCreateOrder();

  3. Paste the <div id="ap-create-order"> block into the admin section,
     right after </div> of #ap-allorders (around line 1154).

  4. Paste the <script> block at the bottom of index.html, before </body>.

  HOW IT WORKS:
  - Admin searches for a customer by email → resolves their user ID
  - Admin picks service from the same catalog (live API), enters qty + link
  - Admin enters the customer's Safaricom phone number
  - Hits "Send STK Push" → calls POST /orders with target_user_id override
    (requires a backend endpoint that accepts admin-placed orders on behalf
     of a user — see backend note at bottom of this file)
  - Widget polls /payments/status/{checkout_id} every 5s
  - On payment success, calls /orders/{id}/submit
  - Order appears immediately in the customer's My Orders + admin All Orders
  ═══════════════════════════════════════════════════════════════════════
-->

<!-- ══════════════════ ADMIN: CREATE ORDER PANEL ══════════════════ -->
<div class="admin-panel" id="ap-create-order">
  <div class="sec-hd" style="flex-wrap:wrap;gap:12px;">
    <div>
      <div class="sec-title">CREATE ORDER FOR CUSTOMER</div>
      <div class="sec-sub">Place an M-Pesa order on behalf of a registered user</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:minmax(360px,480px) 1fr;gap:24px;align-items:start;"
       class="wallet-main-grid">

    <!-- ── Left: Form ── -->
    <div style="background:var(--card);border:1px solid var(--border);
                border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;">

      <!-- Step 1: Customer lookup -->
      <div>
        <div style="font-size:11px;font-weight:700;letter-spacing:1.5px;
                    text-transform:uppercase;color:var(--muted);margin-bottom:10px;">
          STEP 1 · Customer
        </div>
        <div style="display:flex;gap:8px;">
          <input type="email" id="acoEmail" placeholder="customer@email.com"
            style="flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);
                   border-radius:10px;padding:11px 14px;color:var(--white);
                   font-family:'Montserrat',sans-serif;font-size:14px;outline:none;"
            onkeydown="if(event.key==='Enter')lookupCustomer()"/>
          <button class="btn-secondary" id="acoLookupBtn"
                  onclick="lookupCustomer()" style="padding:11px 16px;white-space:nowrap;">
            Look Up
          </button>
        </div>
        <div id="acoCustomerInfo" style="margin-top:10px;"></div>
      </div>

      <!-- Step 2: Service -->
      <div id="acoStep2" style="display:none;">
        <div style="font-size:11px;font-weight:700;letter-spacing:1.5px;
                    text-transform:uppercase;color:var(--muted);margin-bottom:10px;">
          STEP 2 · Service
        </div>
        <input class="search-inp" id="acoSvcSearch" placeholder="🔍 Search services…"
          oninput="filterAcoServices()" style="margin-bottom:10px;width:100%;"/>
        <div id="acoSvcList"
          style="max-height:220px;overflow-y:auto;border:1px solid var(--border);
                 border-radius:10px;background:rgba(255,255,255,.02);">
          <div class="loading-spinner"><div class="spinner"></div><span>Loading…</span></div>
        </div>
        <div id="acoSelectedSvc" style="margin-top:10px;display:none;
          padding:10px 14px;border-radius:10px;background:rgba(61,212,74,.07);
          border:1px solid rgba(61,212,74,.2);font-size:13px;color:var(--white);">
        </div>
      </div>

      <!-- Step 3: Order details -->
      <div id="acoStep3" style="display:none;">
        <div style="font-size:11px;font-weight:700;letter-spacing:1.5px;
                    text-transform:uppercase;color:var(--muted);margin-bottom:10px;">
          STEP 3 · Order Details
        </div>
        <div class="modal-field">
          <label>Link / URL</label>
          <input type="url" id="acoLink" placeholder="https://instagram.com/…"
            oninput="calcAcoCost()"
            style="background:rgba(255,255,255,.05);border:1px solid var(--border);
                   border-radius:10px;padding:11px 14px;width:100%;color:var(--white);
                   font-family:'Montserrat',sans-serif;font-size:14px;outline:none;"/>
        </div>
        <div class="modal-field">
          <label>Quantity</label>
          <input type="number" id="acoQty" placeholder="1000" oninput="calcAcoCost()"
            style="background:rgba(255,255,255,.05);border:1px solid var(--border);
                   border-radius:10px;padding:11px 14px;width:100%;color:var(--white);
                   font-family:'Montserrat',sans-serif;font-size:14px;outline:none;"/>
        </div>
        <div class="cost-preview">
          <span class="cost-lbl">Total Cost</span>
          <span class="cost-val" id="acoCost">KES 0</span>
        </div>
      </div>

      <!-- Step 4: Phone + send -->
      <div id="acoStep4" style="display:none;">
        <div style="font-size:11px;font-weight:700;letter-spacing:1.5px;
                    text-transform:uppercase;color:var(--muted);margin-bottom:10px;">
          STEP 4 · M-Pesa Payment
        </div>
        <div class="modal-field">
          <label>Customer's Safaricom Number</label>
          <div class="phone-flag">
            <span class="flag">🇰🇪</span>
            <input type="tel" id="acoPhone" placeholder="07XX XXX XXX"
              style="background:rgba(255,255,255,.05);border:none;flex:1;
                     padding:11px 14px;color:var(--white);
                     font-family:'Montserrat',sans-serif;font-size:14px;outline:none;"/>
          </div>
        </div>
        <button class="btn-primary" id="acoPlaceBtn" onclick="adminPlaceOrder()"
                style="width:100%;margin-top:4px;">
          📱 SEND STK PUSH TO CUSTOMER
        </button>
      </div>

    </div>

    <!-- ── Right: Status / receipt ── -->
    <div style="background:var(--card);border:1px solid var(--border);
                border-radius:16px;padding:24px;">
      <div style="font-size:11px;font-weight:700;letter-spacing:1.5px;
                  text-transform:uppercase;color:var(--muted);margin-bottom:16px;">
        ORDER STATUS
      </div>
      <div id="acoStatusPanel">
        <div style="text-align:center;padding:40px 20px;color:var(--muted);">
          <div style="font-size:36px;margin-bottom:12px;">📋</div>
          <div style="font-size:13px;">Fill in the form to create an order</div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ══════════════════ ADMIN CREATE ORDER JS ══════════════════ -->
<style>
.aco-svc-row {
  padding: 9px 14px;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  transition: background .12s;
}
.aco-svc-row:last-child { border-bottom: none; }
.aco-svc-row:hover { background: rgba(61,212,74,.06); }
.aco-svc-row.selected { background: rgba(61,212,74,.1); }
.aco-svc-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--white); }
.aco-svc-rate { color: var(--green); font-weight: 700; font-size: 13px; white-space: nowrap; }
</style>

<script>
/* ─── Admin Create Order state ──────────────────────────── */
let _acoUser       = null;    // resolved customer
let _acoSvc        = null;    // selected service
let _acoAllSvcs    = [];      // full service list
let _acoPollTimer  = null;
let _acoOrderId    = null;
let _acoCheckoutId = null;

/* ─── Init (called when tab opens) ─────────────────────── */
async function initAdminCreateOrder() {
  _acoUser = null; _acoSvc = null;
  document.getElementById('acoEmail').value = '';
  document.getElementById('acoCustomerInfo').innerHTML = '';
  document.getElementById('acoStep2').style.display = 'none';
  document.getElementById('acoStep3').style.display = 'none';
  document.getElementById('acoStep4').style.display = 'none';
  _setAcoStatus('idle');

  if (!_acoAllSvcs.length) {
    try {
      const data = await api('/services');
      _acoAllSvcs = (data.services || data.data || data || [])
        .filter(s => !/^tiktok auto\b/i.test(s.name || ''));
    } catch(_) {}
  }
}

/* ─── Step 1: Look up customer by email ────────────────── */
async function lookupCustomer() {
  const email = document.getElementById('acoEmail').value.trim();
  if (!email) { toast('Enter a customer email', 'error'); return; }

  const btn = document.getElementById('acoLookupBtn');
  btn.textContent = 'Looking up…'; btn.disabled = true;

  try {
    // Reuse admin users list — filter by email
    const data  = await api('/admin/users');
    const users = data.users || data.data || data || [];
    const found = users.find(u => (u.email || '').toLowerCase() === email.toLowerCase());

    if (!found) {
      document.getElementById('acoCustomerInfo').innerHTML =
        `<div style="color:#ef5350;font-size:13px;margin-top:4px;">
           ❌ No user found with that email.
         </div>`;
      _acoUser = null;
      document.getElementById('acoStep2').style.display = 'none';
      document.getElementById('acoStep3').style.display = 'none';
      document.getElementById('acoStep4').style.display = 'none';
      return;
    }

    _acoUser = found;
    document.getElementById('acoCustomerInfo').innerHTML = `
      <div style="padding:10px 14px;border-radius:10px;background:rgba(61,212,74,.07);
                  border:1px solid rgba(61,212,74,.2);font-size:13px;">
        <div style="font-weight:700;color:var(--white);">
          ${found.name || found.display_name || '—'}
        </div>
        <div style="color:var(--muted);margin-top:2px;">${found.email}</div>
        <div style="color:var(--muted);margin-top:2px;font-size:11px;">
          Balance: <strong style="color:var(--green);">${fmtKES(found.balance || found.wallet_balance || 0)}</strong>
          · ${found.total_orders || 0} orders
        </div>
      </div>`;

    // Show service picker
    document.getElementById('acoStep2').style.display = 'block';
    document.getElementById('acoSvcSearch').value = '';
    _renderAcoServices(_acoAllSvcs);

  } catch(e) {
    toast(e.message || 'Lookup failed', 'error');
  } finally {
    btn.textContent = 'Look Up'; btn.disabled = false;
  }
}

/* ─── Service list for admin create order ───────────────── */
function filterAcoServices() {
  const q = document.getElementById('acoSvcSearch').value.toLowerCase();
  const filtered = q
    ? _acoAllSvcs.filter(s => (s.name || '').toLowerCase().includes(q) ||
                               (s.category || '').toLowerCase().includes(q))
    : _acoAllSvcs;
  _renderAcoServices(filtered.slice(0, 80));
}

function _renderAcoServices(list) {
  const el = document.getElementById('acoSvcList');
  if (!list.length) {
    el.innerHTML = '<div style="padding:14px;color:var(--muted);font-size:13px;">No services found.</div>';
    return;
  }
  el.innerHTML = list.map(s => {
    const sid = s.service || s.provider_service_id || s.id;
    const sel = _acoSvc && (_acoSvc.service || _acoSvc.id) === sid ? 'selected' : '';
    return `<div class="aco-svc-row ${sel}" onclick="selectAcoService(${JSON.stringify(s).replace(/"/g,'&quot;')})">
      <span class="aco-svc-name" title="${s.name}">${s.name}</span>
      <span class="aco-svc-rate">${fmtKES(s.rate || s.rate_kes)}<span style="color:var(--muted);font-size:10px;font-weight:400;">/1k</span></span>
    </div>`;
  }).join('');
}

function selectAcoService(svcStr) {
  // svcStr comes as object (onclick passes the object ref via JSON)
  const s = typeof svcStr === 'string' ? JSON.parse(svcStr) : svcStr;
  _acoSvc = s;
  document.getElementById('acoSelectedSvc').style.display = 'block';
  document.getElementById('acoSelectedSvc').innerHTML =
    `✅ <strong>${s.name}</strong> &nbsp;·&nbsp; Min: ${(s.min||s.min_qty||10).toLocaleString()} — Max: ${(s.max||s.max_qty||1000000).toLocaleString()}`;
  document.getElementById('acoStep3').style.display = 'block';
  document.getElementById('acoStep4').style.display = 'block';
  document.getElementById('acoQty').value = '';
  document.getElementById('acoLink').value = '';
  document.getElementById('acoCost').textContent = 'KES 0';
  // Re-render list to show selected highlight
  filterAcoServices();
}

function calcAcoCost() {
  if (!_acoSvc) return;
  const qty  = parseInt(document.getElementById('acoQty').value) || 0;
  const rate = parseFloat(_acoSvc.rate || _acoSvc.rate_kes || 0);
  const cost = (qty / 1000) * rate;
  document.getElementById('acoCost').textContent = fmtKES(cost);
}

/* ─── Place the order ───────────────────────────────────── */
async function adminPlaceOrder() {
  if (!_acoUser) { toast('Select a customer first', 'error'); return; }
  if (!_acoSvc)  { toast('Select a service first', 'error'); return; }

  const link  = document.getElementById('acoLink').value.trim();
  const qty   = parseInt(document.getElementById('acoQty').value);
  const phone = document.getElementById('acoPhone').value.trim();

  if (!link)               { toast('Enter the target link/URL', 'error'); return; }
  if (!qty || qty < 1)     { toast('Enter a valid quantity', 'error'); return; }
  if (!phone)              { toast("Enter the customer's phone number", 'error'); return; }

  const btn = document.getElementById('acoPlaceBtn');
  btn.textContent = 'Sending STK Push…'; btn.disabled = true;

  _setAcoStatus('waiting', { phone, svc: _acoSvc.name, qty, cost: document.getElementById('acoCost').textContent });

  try {
    // POST to /orders — backend must accept optional target_user_id for admin-placed orders
    const payload = {
      service_id:     _acoSvc.service || _acoSvc.provider_service_id,
      link,
      quantity:       qty,
      phone,
      target_user_id: _acoUser.id,   // admin-on-behalf-of field
    };
    const resp = await api('/orders', { method:'POST', body:JSON.stringify(payload) });
    _acoOrderId    = resp.id;
    _acoCheckoutId = resp.checkout_request_id;
    _startAcoPoll();
  } catch(e) {
    toast(e.message || 'Failed to place order', 'error');
    _setAcoStatus('idle');
  } finally {
    btn.textContent = '📱 SEND STK PUSH TO CUSTOMER'; btn.disabled = false;
  }
}

/* ─── Payment polling ───────────────────────────────────── */
function _startAcoPoll() {
  _stopAcoPoll();
  let attempts = 0;
  _acoPollTimer = setInterval(async () => {
    attempts++;
    if (attempts > 24) {
      _stopAcoPoll();
      _setAcoStatus('timeout');
      return;
    }
    try {
      const s = await api(`/payments/status/${_acoCheckoutId}`);
      if (s.status === 'success' || s.status === 'completed') {
        _stopAcoPoll();
        try { await api(`/orders/${_acoOrderId}/submit`, { method:'POST' }); } catch(_) {}
        _setAcoStatus('success', { orderId: _acoOrderId });
        loadAdminOrders(); // refresh the All Orders tab
        toast('Order placed & submitted ✓', 'success');
      } else if (s.status === 'failed' || s.status === 'cancelled') {
        _stopAcoPoll();
        _setAcoStatus('failed', { reason: s.result_desc || s.status });
      }
    } catch(_) {}
  }, 5000);
}

function _stopAcoPoll() {
  if (_acoPollTimer) { clearInterval(_acoPollTimer); _acoPollTimer = null; }
}

/* ─── Status panel renderer ─────────────────────────────── */
function _setAcoStatus(state, data = {}) {
  const el = document.getElementById('acoStatusPanel');
  if (state === 'idle') {
    el.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--muted);">
      <div style="font-size:36px;margin-bottom:12px;">📋</div>
      <div style="font-size:13px;">Fill in the form to create an order</div>
    </div>`;
    return;
  }
  if (state === 'waiting') {
    el.innerHTML = `
      <div style="text-align:center;padding:20px 0;">
        <div style="font-size:48px;margin-bottom:14px;">📱</div>
        <div style="font-size:15px;font-weight:800;color:var(--white);margin-bottom:8px;">
          WAITING FOR PAYMENT
        </div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:20px;">
          STK push sent to <strong style="color:var(--white);">${data.phone}</strong>
        </div>
        <div style="background:var(--navy);border:1px solid var(--border);border-radius:10px;
                    padding:14px;text-align:left;margin-bottom:16px;">
          <div style="display:flex;justify-content:space-between;padding:5px 0;
               border-bottom:1px solid var(--border);font-size:13px;">
            <span style="color:var(--muted);">Service</span>
            <span style="max-width:180px;text-align:right;font-size:12px;word-break:break-word;">
              ${data.svc}
            </span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:5px 0;
               border-bottom:1px solid var(--border);font-size:13px;">
            <span style="color:var(--muted);">Quantity</span>
            <span>${parseInt(data.qty).toLocaleString()}</span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px;">
            <span style="color:var(--muted);">Amount</span>
            <strong style="color:var(--green);">${data.cost}</strong>
          </div>
        </div>
        <div class="loading-spinner" style="margin:0 auto 12px;">
          <div class="spinner"></div><span>Checking payment…</span>
        </div>
        <button class="btn-secondary" style="width:100%;" onclick="_stopAcoPoll();_setAcoStatus('idle');">
          ✕ Cancel
        </button>
      </div>`;
    return;
  }
  if (state === 'success') {
    el.innerHTML = `
      <div style="text-align:center;padding:30px 0;">
        <div style="font-size:56px;margin-bottom:14px;">✅</div>
        <div style="font-size:16px;font-weight:800;color:var(--white);margin-bottom:8px;">
          ORDER PLACED!
        </div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:24px;">
          Payment confirmed. Order submitted and visible in<br>
          customer's <strong style="color:var(--white);">My Orders</strong>
          and admin <strong style="color:var(--white);">All Orders</strong>.
        </div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:20px;">
          Order ID: <code style="color:var(--green);">#${(data.orderId||'').slice(0,8)}</code>
        </div>
        <button class="btn-secondary" onclick="initAdminCreateOrder()" style="width:100%;">
          + Create Another Order
        </button>
      </div>`;
    return;
  }
  if (state === 'failed') {
    el.innerHTML = `
      <div style="text-align:center;padding:30px 0;">
        <div style="font-size:56px;margin-bottom:14px;">❌</div>
        <div style="font-size:16px;font-weight:800;color:var(--white);margin-bottom:8px;">
          PAYMENT FAILED
        </div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:24px;">
          ${data.reason || 'The customer did not complete the payment.'}
        </div>
        <button class="btn-primary" onclick="_setAcoStatus('idle')" style="width:100%;">
          Try Again
        </button>
      </div>`;
    return;
  }
  if (state === 'timeout') {
    el.innerHTML = `
      <div style="text-align:center;padding:30px 0;">
        <div style="font-size:56px;margin-bottom:14px;">⏱️</div>
        <div style="font-size:16px;font-weight:800;color:var(--white);margin-bottom:8px;">
          TIMED OUT
        </div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:24px;">
          No payment received in 2 minutes. If the customer paid,
          the order will process automatically once M-Pesa confirms.
        </div>
        <button class="btn-secondary" onclick="initAdminCreateOrder()" style="width:100%;">
          Start Over
        </button>
      </div>`;
  }
}
</script>

<!--
  ═══════════════════════════════════════════════════════════════════════
  BACKEND NOTE — target_user_id support in POST /orders
  ═══════════════════════════════════════════════════════════════════════
  Your existing POST /orders endpoint creates the order for the JWT user.
  To support admin-on-behalf-of, add this to the orders router:

  In the order creation endpoint, after validating the JWT:

    # Allow admins to place orders for other users
    target_user_id = payload.dict().get("target_user_id")
    if target_user_id and current.is_admin:
        order_user_id = target_user_id
    else:
        order_user_id = current.id

  Then use order_user_id wherever the order is created / charged.

  The STK push goes to the phone number in the payload (the customer's
  number), and on success the order is linked to the customer's account.
  No other changes are needed — the polling and submit flow is identical.
  ═══════════════════════════════════════════════════════════════════════
-->
